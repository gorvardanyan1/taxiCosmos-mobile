# Both apps: a fresh install starts on the sign-in screen, never on a signed-in screen and never on the router's technical error page.
# Run with -e APP_ID=<bundle id> (see maestro/scripts/run.sh); the backend must be running (the app asks it for its start-up config).
appId: ${APP_ID}
name: App launches on a fresh install and asks for sign-in
tags:
  - smoke
  - auth
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Enter your phone number'
    timeout: 20000
- assertNotVisible: 'Unmatched Route'
- assertNotVisible: 'Update required'
- assertNotVisible: 'Something went wrong'
